aid: panthalassa
name: Panthalassa
description: 'Panthalassa is a Portland, Oregon public-benefit corporation founded in
  2016 that builds ocean wave-energy "nodes" — a buoyant sphere and central tube that
  convert deep-water wave motion into electricity in the open ocean. Rather than
  transmitting power to shore, the company pairs each node with sealed, seawater-cooled
  compute containers so the electrons power AI and data-center workloads at sea, backhauled
  over satellite link. It has run the Ocean-2 Pacific pilot and markets no public API,
  SDK, developer portal or machine-readable contract; this profile records that absence
  and the company''s public web surface.'
